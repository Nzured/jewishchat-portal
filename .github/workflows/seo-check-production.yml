name: SEO Check — Production Monitoring

# FR-SEO-MON-01/02: ongoing regression protection for the live site, not
# just at merge time — a working template can still degrade later (e.g. a
# category's group count drops below threshold and the noindex logic has
# a bug, or a CDN/Cloudflare config change strips a header). Runs daily and
# after every production deploy. Same warn-only contract as the PR check:
# this workflow's own job status is always success — regressions are
# surfaced via a GitHub issue, not by failing a pipeline that no one is
# watching for a scheduled run.

on:
  schedule:
    # Daily at 09:00 UTC — adjust to whenever someone actually reads issues
    - cron: '0 9 * * *'
  workflow_dispatch: {}   # manual trigger for on-demand checks
  repository_dispatch:
    types: [production-deployed]   # optionally fired by your Vercel deploy hook

permissions:
  contents: read
  issues: write

jobs:
  seo-check:
    name: seo-check-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SEO check against production
        run: |
          node scripts/seo-check/seo-check.js \
            --base-url "https://chatlist.link" \
            --mode production \
            --api-base-url "https://api.chatlist.link/group-service"

      - name: Read issue count
        id: report
        run: |
          COUNT=$(node -e "console.log(require('./seo-check-report.json').totalIssues)")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: seo-check-report-production-${{ github.run_id }}
          path: |
            seo-check-report.json
            seo-check-report.md
          retention-days: 90

      # Only opens/updates an issue when there's something to report —
      # a clean run produces no issue at all, so the issues list only ever
      # shows genuine, current regressions, not a growing pile of "all good"
      # noise. Uses a fixed title so subsequent runs update the SAME issue
      # rather than opening a new one every day.
      - name: Open or update tracking issue on regression
        if: steps.report.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('seo-check-report.md', 'utf8');
            const title = 'SEO Check — production regression detected';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'seo-monitoring',
            });

            const existing = issues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Regression still present as of this run:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['seo-monitoring'],
              });
            }

      # Closes the tracking issue automatically once a clean run confirms
      # the regression is resolved — no manual bookkeeping needed.
      - name: Close tracking issue if now clean
        if: steps.report.outputs.count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'SEO Check — production regression detected';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'seo-monitoring',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Latest run found 0 issues — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
